apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: <app-name>
  name: <app-name>
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: <app-name>
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: <app-name>
    spec:
      {{- if eq .Values.environment "prod" }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - <app-name>
            topologyKey: "kubernetes.io/hostname"
      {{- end }}
      containers:
      - envFrom:
        - configMapRef:
            name: <app-name>-env
        image: {{ .Values.aws_account_id }}.dkr.ecr.us-east-1.amazonaws.com/rackoot/<app-name>:{{ .Values.app_version }}
        imagePullPolicy: Always
        name: <app-name>
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        lifecycle:
          postStart:
            exec:
              command:
                - "/bin/sh"
                - "-c"
                - "/usr/sbin/pushEnvVars.sh"
        resources:
          limits:
            cpu: 200m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /index.html
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /index.html
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        startupProbe:
          httpGet:
            path: /index.html
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
      nodeSelector:
        eks.amazonaws.com/nodegroup: {{ .Values.node_selector }}
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      serviceAccount: rackoot-iam
      serviceAccountName: rackoot-iam