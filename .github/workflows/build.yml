on:
  push:
    tags:
    - '**'

permissions: read-all

name: "Build"

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  GITHUB_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
  DEPLOYMENT: ${{ vars.DEPLOYMENT }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  HELM_CHART_REPO: ${{ vars.HELM_CHART_REPO }}
  AWS_ACCOUNT: ${{ vars.AWS_ACCOUNT }}


jobs:
  set-release-revision:
    runs-on: ubuntu-latest
    outputs: 
      RELEASE_REVISION: ${{ steps.set-release-revision.outputs.RELEASE_REVISION }}
    steps:
    - name: Set env
      id: set-release-revision
      run: | 
        echo "RELEASE_REVISION=${GITHUB_REF#refs/*/}" >> $GITHUB_OUTPUT

  build-docker-image:
    needs: [set-release-revision]
    uses: Feria-del-Libro/workflows-comunes/.github/workflows/buildDockerImage.yml@main
    with:
      RELEASE_REVISION: ${{ needs.set-release-revision.outputs.RELEASE_REVISION }}
      DOCKER_FILE: docker/dockerfile
      ECR_REPOSITORY: $${{ vars.ECR_REPOSITORY }}}}
    secrets: inherit

  scan-image:
    needs: [set-release-revision, build-docker-image]
    uses: Feria-del-Libro/workflows-comunes/.github/workflows/trivyScanner.yml@main
    with:
      ECR_REPOSITORY: "${{ vars.ECR_REPOSITORY }}"
      RELEASE_REVISION: ${{ needs.set-release-revision.outputs.RELEASE_REVISION }}
      DEPLOYMENT: ${{ vars.DEPLOYMENT }}
    secrets: inherit

  build-helm-package:
    needs: [set-release-revision, build-docker-image] 
    uses: Feria-del-Libro/workflows-comunes/.github/workflows/buildHelmPackage.yml@main
    with:
      LOCAL_PATH: ./helm/chart
      RELEASE_REVISION: ${{ needs.set-release-revision.outputs.RELEASE_REVISION }}
      HELM_CHART_REPO: ${{ vars.HELM_CHART_REPO }}
      DEPLOYMENT: ${{ vars.DEPLOYMENT }}
    secrets: inherit

  deploy:
    needs: [set-release-revision]
    name: Deploy Chart
    uses: Feria-del-Libro/workflows-comunes/.github/workflows/deployHelmChart-V2.yml@main
    with:
      AWS_ACCOUNT: ${{ vars.AWS_ACCOUNT }}
      DEPLOYMENT: ${{ vars.DEPLOYMENT }}
      RELEASE_REVISION: ${{ needs.set-release-revision.outputs.RELEASE_REVISION }}
      HELM_CHART_REPO: ${{ vars.HELM_CHART_REPO }}
      ENVIRONMENT: dev
    secrets: inherit